[package]
name = "tree-sitter-grammars-rs"
version = "0.1.0"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
edition = "2024"
description = "Pure-Rust tree-sitter grammars in three feature-selected tiers (lite, medium, full): no C, no build.rs"
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "parser", "grammar", "javascript", "python"]
categories = ["parsing", "development-tools"]
repository = "https://github.com/aovestdipaperino/tree-sitter-grammars-rs"

[features]
default = ["lite"]
# Tiers. Each one includes the one below it; pick single languages with the `lang-*` features.
lite = ["lang-c", "lang-go", "lang-java", "lang-javascript", "lang-python", "lang-rust", "lang-tsx", "lang-typescript"]
medium = ["lite", "lang-lua", "lang-dart", "lang-cpp", "lang-scala", "lang-kotlin", "lang-ruby", "lang-c_sharp", "lang-bash", "lang-php", "lang-swift"]
full = ["medium", "lang-qbasic", "lang-zig", "lang-pascal", "lang-objc", "lang-vbnet", "lang-batch", "lang-msbasic2", "lang-gwbasic", "lang-nix", "lang-glsl", "lang-clojure", "lang-toml", "lang-powershell", "lang-quint", "lang-dockerfile", "lang-protobuf", "lang-ocaml", "lang-erlang", "lang-sql", "lang-cobol", "lang-fsharp", "lang-lean", "lang-julia", "lang-elixir", "lang-markdown_inline", "lang-r", "lang-perl", "lang-fortran", "lang-markdown", "lang-haskell"]

# Languages (one feature each).
lang-c = []
lang-go = []
lang-java = []
lang-javascript = []
lang-python = []
lang-rust = []
lang-tsx = []
lang-typescript = []
lang-lua = []
lang-dart = []
lang-cpp = []
lang-scala = []
lang-kotlin = []
lang-ruby = []
lang-c_sharp = []
lang-bash = []
lang-php = []
lang-swift = []
lang-qbasic = []
lang-zig = []
lang-pascal = []
lang-objc = []
lang-vbnet = []
lang-batch = []
lang-msbasic2 = []
lang-gwbasic = []
lang-nix = []
lang-glsl = []
lang-clojure = []
lang-toml = []
lang-powershell = []
lang-quint = []
lang-dockerfile = []
lang-protobuf = []
lang-ocaml = []
lang-erlang = []
lang-sql = []
lang-cobol = []
lang-fsharp = []
lang-lean = []
lang-julia = []
lang-elixir = []
lang-markdown_inline = []
lang-r = []
lang-perl = []
lang-fortran = []
lang-markdown = []
lang-haskell = []

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"
